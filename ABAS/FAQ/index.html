<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atendimento</title>
    <link rel="stylesheet" href="faq.css">
    <link rel="stylesheet" href="faq2.css">
    <script defer src="../../script.js"></script>
    <script defer src="../../matomo.js"></script>
    <link rel="icon" type="image/x-icon" href="img/ztrlogo.png">
</head>
<body>

    <div class="update-container">
        <a href="../../../../" class="botao-download">
            <span>Voltar</span>
        </a>

        <div class="content">
            <h1 id="titulo">Como entrar em contato com um atendente ?</h1>
            <p id="descricao">Abaixo está um botão escrito Converse conosco.</p>
            <p>Então basta clicar no botão e mandar uma mensagem e aguarde a resposta da ZTR COMPANY.</p>
           
            <script src="//code.tidio.co/ji55td5wiuexkvtovzf5e75icaqa1xrn.js" async></script>
 


            <a href="sobre/" class="esconder">
                <span>🛠 Sobre</span>
            </a>


            
            <div class="esconder"id="midia-container">
                <video controls width="600">
                    <source src="midia/video.mp4" type="video/mp4">
                </video>
                
                <audio controls>
                    <source src="midia/audio.mp3" type="audio/mpeg">
                </audio>
                
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const params = new URLSearchParams(window.location.search);
            const titulo = params.get("titulo");
            const descricao = params.get("descricao");
            const banner = params.get("banner");
            const midia = params.get("midia") ? params.get("midia").split(",") : [];

            if (titulo) document.getElementById("titulo").textContent = titulo;
            if (descricao) document.getElementById("descricao").textContent = descricao;
            if (banner) document.getElementById("banner-img").src = banner;

            const midiaContainer = document.getElementById("midia-container");
            midia.forEach(src => {
                let element;
                if (src.endsWith(".mp4")) {
                    element = document.createElement("video");
                    element.controls = true;
                } else {
                    element = document.createElement("img");
                }
                element.src = src;
                element.classList.add("midia-item");
                midiaContainer.appendChild(element);
            });
        });
    </script>

<script src="https://cdn.jsdelivr.net/npm/ua-parser-js@1.0.35/dist/ua-parser.min.js"></script>
<script>
  const parser = new UAParser();
  const navegadorInfo = parser.getBrowser();
  const device = parser.getDevice();
  const sistema = parser.getOS();

  fetch("https://rastreador-rkro.onrender.com/rastrear", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      site: "site-do-github",                 // personalize com o nome do seu site
      pagina: window.location.pathname,
      navegador: `${navegadorInfo.name || "desconhecido"} ${navegadorInfo.version || ""}`.trim(),
      sistema: `${sistema.name || "desconhecido"} ${sistema.version || ""}`.trim(),
      dispositivo: device.type || "desktop",  // mobile, tablet, console, desktop
      idioma: navigator.language || "desconhecido",
      resolucao: `${screen.width}x${screen.height}`,
      referer: document.referrer || "direto"
    })
  });
</script>
